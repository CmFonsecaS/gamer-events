# Base de datos MySQL de Gamer Events (local, Docker Desktop).
# Uso:  docker compose up -d     (desde la carpeta del proyecto)
# Las credenciales se leen del archivo .env (copiar desde .env.example).
name: gamer-events

services:
  mysql:
    image: mysql:8.4
    container_name: gamer-events-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD en .env}
      APP_DB_USER: ${DB_USER:?Definir DB_USER en .env}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
      TZ: America/Santiago
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - gamer-events-mysql-data:/var/lib/mysql
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_datos.sql:/docker-entrypoint-initdb.d/02_datos.sql:ro
      - ./database/03_usuario_app.sh:/docker-entrypoint-initdb.d/03_usuario_app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  gamer-events-mysql-data:
