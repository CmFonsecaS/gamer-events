spring.application.name=backend

# Secretos y datos de conexión: se leen del archivo .env de la raíz del proyecto (no versionado)
# o de variables de entorno del sistema.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

server.port=${BACKEND_PORT:8091}
# En desarrollo la API solo escucha en el propio equipo.
server.address=${BACKEND_ADDRESS:127.0.0.1}

# --- Base de datos MySQL (Docker) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/gamer_events?serverTimezone=America/Santiago&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# El esquema lo crean los scripts SQL de /database; Hibernate no lo modifica.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=gamer-events-backend
app.jwt.expiration-minutes=30

# --- Errores: nunca exponer detalles internos ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
