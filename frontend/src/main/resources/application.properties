spring.application.name=frontend

# Configuración local compartida (archivo .env de la raíz, no versionado) o variables de entorno.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Puertos: frontend 8090, backend 8091.
server.port=${FRONTEND_PORT:8090}
# En desarrollo solo escucha en el propio equipo.
server.address=${FRONTEND_ADDRESS:127.0.0.1}

# URL del backend (API REST)
app.backend.url=${BACKEND_URL:http://localhost:8091}

# --- Sesión web ---
# La sesión dura lo mismo que el JWT del backend (30 min).
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=GE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Poner en true cuando la aplicación se publique con HTTPS.
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
# Nunca enviar el identificador de sesión en la URL.
server.servlet.session.tracking-modes=cookie

# --- Idioma y fechas ---
spring.web.locale=es_CL
spring.web.locale-resolver=fixed

# --- Errores: nunca exponer detalles internos ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
